<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>واجد | تواصل فوري وآمن</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script src="/js/lucide.min.js"></script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      background: var(--bg-subtle);
    }
    .scanner-shell {
      display: flex;
      flex-direction: column;
      max-width: 580px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
    }
    .scanner-header {
      padding: 13px 18px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }
    .location-bar {
      background: var(--primary-light);
      border-bottom: 1px solid var(--primary-border);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="scanner-shell">
    <!-- Header -->
    <div class="scanner-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-icon-wrap" id="itemAvatar" style="color: var(--primary);">
          <i data-lucide="car"></i>
        </div>
        <div>
          <h2 style="font-size: 15.5px; font-weight: 700;" id="itemHeaderTitle">جاري التحميل...</h2>
          <span style="font-size: 11.5px; color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
            <i data-lucide="check-circle-2" style="width: 12px; height: 12px;"></i>
            <span>المالك متصل للتنبيه الفوري</span>
          </span>
        </div>
      </div>
      <a href="/" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-main);" title="واجد">
        <img src="/logo.svg" alt="Waged" width="24" height="24">
        <span>واجد</span>
      </a>
    </div>

    <!-- Privacy & 1-Tap Location Bar -->
    <div class="location-bar" id="locationActionBar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <i data-lucide="lock" style="width: 14px; height: 14px; color: var(--primary);"></i>
        <span>محادثة سرية بدون كشف رقمك</span>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="shareLocationBtn" onclick="sendLiveLocationPin()" style="padding: 5px 12px; font-size: 12px; display: none;">
        <i data-lucide="map-pin" style="width: 14px; height: 14px;"></i>
        <span>إرسال موقعي للمالك</span>
      </button>
    </div>

    <!-- Lost Mode Urgent Alert -->
    <div id="lostBanner" class="lost-banner" style="display: none;">
      <i data-lucide="alert-triangle" style="width: 20px; height: 20px;"></i>
      <div>
        <strong>تنبيه غرض مفقود</strong>
        <div style="font-size: 12px; opacity: 0.94;">المالك يبحث عن هذا الغرض. نرجو مراسلته ومشاركة موقعك لتسليمه.</div>
      </div>
    </div>

    <!-- Owner Custom Message -->
    <div id="ownerMsgCard" style="display: none; margin: 12px 16px 0; padding: 11px 14px; background: var(--warning-light); border: 1px solid #fde68a; border-radius: var(--radius-sm); font-size: 13px; color: #92400e;">
      <strong>ملاحظة المالك:</strong>
      <p id="ownerMsgText" style="margin-top: 2px;"></p>
    </div>

    <!-- Chat Messages (Opens Immediately) -->
    <div class="chat-messages" id="chatMessages">
      <div style="text-align: center; color: var(--text-muted); margin: auto; font-size: 13.5px;">جاري فتح المحادثة الآمنة...</div>
    </div>

    <div class="typing-indicator" id="typingIndicator">المالك يكتب الآن...</div>

    <!-- Quick Replies -->
    <div class="quick-replies" id="quickReplies" style="display: none;"></div>

    <!-- Message Input -->
    <form class="chat-input-area" id="chatForm" style="display: none;" onsubmit="handleSendMessage(event)">
      <button type="button" class="icon-btn" onclick="sendLiveLocationPin()" title="إرسال موقعي الحالي" style="border-radius: 50%; flex-shrink: 0;">
        <i data-lucide="map-pin"></i>
      </button>
      <input type="text" class="chat-input" id="messageInput" placeholder="اكتب رسالتك للمالك هنا..." required autocomplete="off" oninput="emitTyping()">
      <button type="submit" class="btn btn-primary" style="border-radius: 999px; padding: 9px 18px;">
        <i data-lucide="send"></i>
        <span>إرسال</span>
      </button>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/chat.js"></script>
</body>
</html>
