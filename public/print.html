<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو طباعة الملصقات | منصة واجد</title>
  <link rel="stylesheet" href="/css/print.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-5 0h3v2h-3v-2zm2 3h3v3h-3v-3zm3 0h2v2h-2v-2zm0 3h2v2h-2v-2zm-5 0h3v2h-3v-2z'/></svg>">
</head>
<body>

  <!-- Studio Controls (hidden when printing) -->
  <div class="print-controls">
    <div class="controls-top">
      <div>
        <h2 style="font-size: 20px; font-weight: 900; color: #0f172a; margin: 0 0 4px;">🖨️ استوديو طباعة ملصقات واجد</h2>
        <p style="color: #64748b; font-size: 13px; margin: 0;">خصّص تصميم الملصق ولونه واطبعه بدقة Vector فائقة</p>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button onclick="window.print()" style="background: #2563eb; color: #fff; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 800; font-family: inherit; cursor: pointer; font-size: 14px;">
          🖨️ طباعة / حفظ PDF
        </button>
        <a href="/dashboard.html" style="color: #475569; font-size: 13px; font-weight: 700; text-decoration: none; padding: 9px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px;">
          ← لوحة التحكم
        </a>
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-field">
        <label>نوع القالب (Label Type)</label>
        <select id="stickerType" onchange="renderStickers()">
          <option value="car">🚗 ملصق زجاج السيارة (الركنة والطوارئ)</option>
          <option value="device">💻 ملصق لابتوب وأجهزة إلكترونية</option>
          <option value="bag">💼 بطاقة حقائب وأمتعة السفر</option>
          <option value="mini">🏷️ ملصق مصغر (مفاتيح / مقتنيات)</option>
        </select>
      </div>

      <div class="control-field">
        <label>لون التصميم (Theme)</label>
        <select id="stickerTheme" onchange="renderStickers()">
          <option value="blue">🔵 أزرق واجد الرسمي</option>
          <option value="dark">⚫ أسود فخم (Executive)</option>
          <option value="amber">🟡 تحذيري (أصفر / أسود)</option>
          <option value="emerald">🟢 أخضر أمان</option>
        </select>
      </div>

      <div class="control-field">
        <label>عدد الملصقات في الصفحة</label>
        <select id="sheetCount" onchange="renderStickers()">
          <option value="1">ملصق واحد (1x)</option>
          <option value="2">ملصقان (2x)</option>
          <option value="4" selected>4 ملصقات (4x)</option>
          <option value="6">6 ملصقات (6x)</option>
        </select>
      </div>

      <div class="control-field">
        <label>إظهار اسم الغرض على الملصق</label>
        <select id="showItemName" onchange="renderStickers()">
          <option value="yes" selected>نعم، إظهار الاسم</option>
          <option value="no">لا، إخفاء الاسم للخصوصية</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Sheet Container for Printable Cards -->
  <div class="sheet-container" id="sheetContainer">
    <div style="text-align: center; padding: 50px; color: #64748b;">جاري تحضير استوديو الطباعة...</div>
  </div>

  <script>
    let itemData = null;
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    async function loadItemData() {
      if (!code) {
        document.getElementById('sheetContainer').innerHTML = '<div style="color: #dc2626; text-align: center; font-weight: 700;">رمز الكود غير محدد في الرابط</div>';
        return;
      }

      try {
        const res = await fetch(`/api/scan/info/${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error('فشل في جلب بيانات الكود أو تم حذفه');
        itemData = await res.json();

        // Auto-select matching template based on item category
        const catMap = { car: 'car', laptop: 'device', bag: 'bag', keys: 'mini', pet: 'mini' };
        if (catMap[itemData.category]) {
          document.getElementById('stickerType').value = catMap[itemData.category];
        }

        renderStickers();
      } catch (err) {
        console.error(err);
        document.getElementById('sheetContainer').innerHTML = `<div style="color: #dc2626; text-align: center; font-weight: 700;">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderStickers() {
      if (!itemData) return;

      const type = document.getElementById('stickerType').value;
      const theme = document.getElementById('stickerTheme').value;
      const count = parseInt(document.getElementById('sheetCount').value, 10);
      const showName = document.getElementById('showItemName').value === 'yes';
      const container = document.getElementById('sheetContainer');

      container.className = type === 'mini' ? 'sheet-container mini-grid' : 'sheet-container';

      let instruction = '';
      let tagTitle = '';
      let subnote = '';

      if (type === 'car') {
        tagTitle = '🚗 تنبيه سيارة';
        instruction = 'العربية مزنقة عليك أو في أي طارئ؟<br><strong>امسح الرمز للتواصل المباشر مع السائق</strong>';
        subnote = 'محادثة فورية وسرية 100% دون كشف رقم الهاتف';
      } else if (type === 'device') {
        tagTitle = '💻 جهاز محمي';
        instruction = 'إذا عثرت على هذا الجهاز، نرجو مسح الرمز<br><strong>لمراسلة المالك وإرسال الموقع لتسليمه</strong>';
        subnote = 'تواصل آمن ومشفر بالكامل عبر منصة واجد';
      } else if (type === 'bag') {
        tagTitle = '💼 بطاقة أمتعة';
        instruction = 'حقيبة / مقتنيات شخصية محمية<br><strong>امسح الرمز للتواصل الفوري مع المالك</strong>';
        subnote = 'لا يتم مشاركة أي بيانات شخصية عند المسح';
      } else {
        tagTitle = '🛡️ محمي بواجد';
        instruction = '<strong>امسح الرمز للتواصل الآمن مع المالك</strong>';
        subnote = 'محادثة فورية مشفرة';
      }

      // Crisp local SVG QR generated by Waged server
      const qrSrc = `/api/scan/qr/${encodeURIComponent(code)}`;
      const hostLabel = window.location.host;

      let cardsHtml = '';
      for (let i = 0; i < count; i++) {
        cardsHtml += `
          <div class="sticker-card theme-${theme} ${type === 'mini' ? 'layout-mini' : ''}">
            <div class="sticker-top-bar">
              <div class="sticker-brand">
                <span>واجد</span>
                <small style="font-size: 10px; opacity: 0.8;">WAGED</small>
              </div>
              <div class="sticker-tag">${tagTitle}</div>
            </div>

            ${showName ? `<div class="sticker-item-name">${escapeHtml(itemData.name)}</div>` : ''}

            <div class="sticker-qr-frame">
              <img src="${qrSrc}" alt="Waged QR Code">
            </div>

            <div class="sticker-instruction">${instruction}</div>
            <div class="sticker-subnote">${subnote}</div>

            <div class="sticker-footer">
              <span>🛡️ خصوصية 100%</span>
              <span>${escapeHtml(hostLabel)}</span>
            </div>
            <span class="cut-hint">✂️ قص على الحدود المنقطة</span>
          </div>
        `;
      }

      container.innerHTML = cardsHtml;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadItemData();
  </script>
</body>
</html>
