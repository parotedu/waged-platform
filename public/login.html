<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول / حساب جديد - منصة واجد</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-card {
      max-width: 460px;
      margin: 60px auto;
      padding: 36px;
      border-radius: var(--radius-xl);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .auth-tab.active {
      color: var(--primary);
    }
    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }
    .alert-error {
      background: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 12px;
      border-radius: var(--radius-md);
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">
        <div class="logo-badge">W</div>
        <span>واجد <small style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Waged</small></span>
      </a>
      <a href="/" class="btn btn-outline btn-sm">الرئيسية</a>
    </div>
  </nav>

  <div class="container">
    <div class="card auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 26px; font-weight: 900; color: var(--dark); margin-bottom: 6px;">مرحباً بك في واجد</h2>
        <p style="color: var(--text-muted); font-size: 14px;">إدارة رموز الـ QR والتواصل الآمن لمقتنياتك</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</div>
        <div class="auth-tab" id="tabSignup" onclick="switchTab('signup')">إنشاء حساب جديد</div>
      </div>

      <div class="alert-error" id="errorBox"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="loginBtn">
          تسجيل الدخول
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">الاسم بالكامل</label>
          <input type="text" class="form-control" id="signupName" required placeholder="مثال: أحمد محمد">
        </div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="signupEmail" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهاتف (اختياري - للاستخدام الداخلي فقط ولا يظهر لأحد)</label>
          <input type="tel" class="form-control" id="signupPhone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-control" id="signupPassword" required minlength="6" placeholder="لا تقل عن 6 أحرف">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="signupBtn">
          إنشاء حساب وتأكيد
        </button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabSignup').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
      hideError();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // Check URL params for ?tab=signup
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'signup') {
      switchTab('signup');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');

        localStorage.setItem('waged_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideError();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const btn = document.getElementById('signupBtn');

      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل إنشاء الحساب');

        localStorage.setItem('waged_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'إنشاء حساب وتأكيد';
      }
    }
  </script>
</body>
</html>
