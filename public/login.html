<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>تسجيل الدخول / حساب جديد — واجد</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script src="/js/lucide.min.js"></script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: var(--bg-subtle);
    }
    .auth-shell {
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border-radius: var(--radius-xl);
      background: #ffffff;
    }
    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-muted);
      border: 1px solid var(--card-border);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.16s;
    }
    .auth-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .pass-wrap {
      position: relative;
    }
    .pass-toggle {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .alert-error {
      background: var(--danger-light);
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">
        <div class="logo-icon-wrap">
          <img src="/logo.svg" alt="شعار واجد">
        </div>
        <span>واجد <small class="mono" style="font-size: 13px; color: var(--text-muted); font-weight: 500;">Waged</small></span>
      </a>
      <a href="/" class="btn btn-outline btn-sm">
        <i data-lucide="arrow-right"></i>
        <span>الرئيسية</span>
      </a>
    </div>
  </nav>

  <main class="auth-shell">
    <div class="card auth-card">
      <div style="text-align: center; margin-bottom: 22px;">
        <div class="logo-icon-wrap" style="width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px;">
          <img src="/logo.svg" alt="Waged">
        </div>
        <h2 style="font-size: 22px; font-weight: 700;">مرحباً بك في واجد</h2>
        <p style="color: var(--text-muted); font-size: 13.5px; margin-top: 4px;">إدارة رموز الـ QR والتواصل الفوري المشفر</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</div>
        <div class="auth-tab" id="tabSignup" onclick="switchTab('signup')">إنشاء حساب</div>
      </div>

      <div class="alert-error" id="errorBox"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <div class="pass-wrap">
            <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" style="padding-left: 38px;">
            <button type="button" class="pass-toggle" onclick="togglePass('loginPassword', this)" aria-label="إظهار كلمة المرور">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="loginBtn">
          تسجيل الدخول
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">الاسم بالكامل</label>
          <input type="text" class="form-control" id="signupName" required placeholder="مثال: أحمد محمد" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="signupEmail" required placeholder="name@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهاتف (اختياري وسري تماماً)</label>
          <input type="tel" class="form-control" id="signupPhone" placeholder="01xxxxxxxxx" autocomplete="tel">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <div class="pass-wrap">
            <input type="password" class="form-control" id="signupPassword" required minlength="6" placeholder="6 أحرف فأكثر" autocomplete="new-password" style="padding-left: 38px;">
            <button type="button" class="pass-toggle" onclick="togglePass('signupPassword', this)" aria-label="إظهار كلمة المرور">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="signupBtn">
          إنشاء الحساب
        </button>
      </form>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const selectedPlan = params.get('plan');

    fetch('/api/auth/me')
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.user) {
          window.location.href = getPostAuthUrl();
        }
      }).catch(() => {});

    function getPostAuthUrl() {
      if (selectedPlan && selectedPlan !== 'free') {
        return `/dashboard.html?tab=billing&upgrade=${encodeURIComponent(selectedPlan)}`;
      }
      return '/dashboard.html';
    }

    function togglePass(id, btn) {
      const inp = document.getElementById(id);
      const isHidden = inp.type === 'password';
      inp.type = isHidden ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${isHidden ? 'eye-off' : 'eye'}"></i>`;
      refreshIcons(btn);
    }

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabSignup').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
      hideError();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    if (params.get('tab') === 'signup') {
      switchTab('signup');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');

        localStorage.setItem('waged_user', JSON.stringify(data.user));
        window.location.href = getPostAuthUrl();
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideError();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const btn = document.getElementById('signupBtn');

      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل إنشاء الحساب');

        localStorage.setItem('waged_user', JSON.stringify(data.user));
        window.location.href = getPostAuthUrl();
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
      }
    }
  </script>
</body>
</html>
