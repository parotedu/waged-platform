databases:
  - name: waged-db
    plan: free
    databaseName: waged
    user: waged_user

services:
  - type: web
    name: waged-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: waged-db
          property: connectionString
      - key: INSTAPAY_NUMBER
        value: "01557527365"
      - key: SUPER_ADMIN_EMAIL
        value: admin@waged.app
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
